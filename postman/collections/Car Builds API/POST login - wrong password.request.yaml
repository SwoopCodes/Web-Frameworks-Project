$kind: http-request
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    username: user
    password: wrongpassword
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 (login page shown again)", () => pm.response.to.have.status(200));
      pm.test("Error message is shown", () => pm.expect(pm.response.text()).to.include("Incorrect username or password"));
    language: text/javascript
settings:
  followRedirects: false
order: 3000
