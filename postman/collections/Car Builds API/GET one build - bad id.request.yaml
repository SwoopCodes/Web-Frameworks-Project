$kind: http-request
url: "{{baseUrl}}/api/builds/abc"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400", () => pm.response.to.have.status(400));
      pm.test("Response is JSON", () => pm.response.to.be.json);
      pm.test("Message says the id is invalid", function () {
        pm.expect(pm.response.json().message).to.eql("Invalid build id");
      });
    language: text/javascript
order: 1200
